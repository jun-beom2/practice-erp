<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사내 ERP (연습용) — 납품입력</title>
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <div id="file-warning" class="warn" hidden>
    ⚠️ 이 페이지는 <b>프록시 서버</b>로 열어야 합니다. (Codex에 "이 폴더에서 프록시 서버 열어줘" 또는 <code>python proxy_server.py</code>)
  </div>

  <div class="titlebar">
    <span class="logo"></span>
    <span class="sys">사내 ERP</span>
    <span class="practice">연습용</span>
    <div class="tabs">
      <a href="./index.html">발주내역조회(협력사)</a>
      <a href="./input.html" class="active">납품입력(협력사)</a>
    </div>
  </div>

  <div class="toolbar">
    <span class="tbtn">🆕 신규</span>
    <span class="tbtn">🔍 조회</span>
    <span class="sep"></span>
    <button id="tb-save" data-testid="save-button">💾 저장</button>
    <span class="tbtn">🗑 행삭제</span>
    <span class="sep"></span>
    <span class="tbtn">🧾 거래명세서(구매)</span>
  </div>

  <div class="page">
    <div class="formcard">
      <div class="formgrid">
        <label class="req">납품일</label><input type="date" value="2026-06-03">
        <label>납품번호</label><input type="text" placeholder="(저장 시 자동 채번)">
        <label class="req">구매거래처</label><input id="vendor" type="text" readonly>
        <label>내외자구분</label><select><option>내수</option><option>외자</option></select>
        <label class="req">통화</label><input type="text" value="KRW" style="width:90px">
        <label>환율</label><input type="text" value="1.00" style="width:90px">
        <label>특이사항</label><textarea class="full" rows="2" placeholder="(연습용)"></textarea>
      </div>
      <div class="summary">
        <div><b>금액계</b><span id="sum1">0</span></div>
        <div><b>부가세계</b><span id="sum2">0</span></div>
        <div><b>금액총계</b><span id="sum3">0</span></div>
      </div>
    </div>

    <div class="notice">
      ※ 연습용 — 가상 데이터. 자동화는 <b>납품수량</b>을 채우고 <b>저장 직전에서 멈춥니다.</b>
      선택 실습에서만 저장을 눌러 F12의 <code>api/deliveries</code> 요청을 확인합니다.
    </div>

    <div class="grid-wrap" style="margin-top:6px">
      <table class="grid">
        <thead>
          <tr>
            <th>선택</th><th>품명</th><th>품번</th><th>규격</th><th>단위</th>
            <th>발주수량</th><th>납품수량</th><th>단가</th><th>금액</th><th>부가세율</th><th>창고</th><th>비고</th>
          </tr>
        </thead>
        <tbody id="rows"><tr><td colspan="12" class="ctr" style="color:#9aa3ad;padding:18px">발주를 불러오는 중…</td></tr></tbody>
      </table>
    </div>

    <div id="saved" class="saved"></div>
  </div>

  <script>
    if (location.protocol === 'file:') document.getElementById('file-warning').hidden = false;

    function won(n) { return Number(n).toLocaleString('ko-KR'); }
    var po = new URLSearchParams(location.search).get('po');
    var current = null;

    (async function () {
      try {
        var res = await fetch('./proxy/orders', { cache: 'no-store' });
        if (!res.ok) throw new Error('proxy failed');
        var data = await res.json();
        var o = data.orders.find(function (x) { return x.발주번호 === po; }) || data.orders[0];
        current = o;
        document.getElementById('vendor').value = o.거래처;
        document.getElementById('rows').innerHTML =
          '<tr>' +
          '<td class="ctr"><input type="checkbox"></td>' +
          '<td>' + o.품명 + '</td>' +
          '<td>' + o.품번 + '</td>' +
          '<td>' + o.규격 + '</td>' +
          '<td class="ctr">' + o.단위 + '</td>' +
          '<td class="num">' + won(o.발주수량) + '</td>' +
          '<td class="ctr"><input id="qty" data-testid="delivery-qty" class="qty" type="number" min="0" placeholder="0"></td>' +
          '<td class="num">' + won(o.단가) + '</td>' +
          '<td class="num" id="lineAmt">0</td>' +
          '<td class="ctr">10.0%</td>' +
          '<td class="ctr">' + o.창고 + '</td>' +
          '<td><input type="text" style="width:120px;border:1px solid #cdd4db;border-radius:5px;padding:4px 6px"></td>' +
          '</tr>';
        document.getElementById('qty').addEventListener('input', recalc);
      } catch (e) {
        document.getElementById('rows').innerHTML =
          '<tr><td colspan="12" class="ctr" style="color:#b91c1c;padding:18px">발주를 불러오지 못했습니다 — python proxy_server.py로 열었는지 확인하세요.</td></tr>';
      }
    })();

    function recalc() {
      if (!current) return;
      var qty = Number(document.getElementById('qty').value) || 0;
      var amt = qty * current.단가;
      var vat = Math.round(amt * 0.1);
      document.getElementById('lineAmt').textContent = won(amt);
      document.getElementById('sum1').textContent = won(amt);
      document.getElementById('sum2').textContent = won(vat);
      document.getElementById('sum3').textContent = won(amt + vat);
    }

    document.getElementById('tb-save').addEventListener('click', async function () {
      var qtyEl = document.getElementById('qty');
      var saved = document.getElementById('saved');
      if (!qtyEl || !qtyEl.value) { saved.innerHTML = '<span style="color:#b91c1c">납품수량을 입력하세요.</span>'; return; }
      if (!confirm('연습 ERP에서만 더미 저장 요청을 보냅니다. 진짜 ERP에서는 저장 직전에서 멈춥니다. 계속할까요?')) return;

      try {
        var payload = {
          발주번호: current.발주번호,
          거래처: current.거래처,
          품번: current.품번,
          납품수량: Number(qtyEl.value),
          연습용: true
        };
        var res = await fetch('./api/deliveries', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        var data = await res.json();
        if (!data.ok) throw new Error(data.error || 'save failed');
        sessionStorage.setItem('ordersSearched', '1');

        saved.innerHTML =
          '✅ 연습용 저장 요청을 보냈습니다. 발주내역조회로 돌아가면 납품수량과 상태가 반영됩니다.<br>' +
          '<span style="color:#6b7280;font-size:12.5px;">F12 Network에서 <b>api/deliveries</b>의 Payload도 확인할 수 있습니다.</span><br>' +
          '<span style="color:#6b7280;font-size:12.5px;">진짜 ERP에서는 자동화가 여기 \'저장\' 직전에서 <b>멈추고</b>, 사람이 확인 후 누릅니다.</span>';
      } catch (e) {
        saved.innerHTML = '<span style="color:#b91c1c">저장 요청 실패 — python proxy_server.py로 열었는지 확인하세요.</span>';
      }
    });
  </script>
</body>
</html>
